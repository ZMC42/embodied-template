# Reduced from RLinf libero_spatial_ppo_gr00t_n1d7.
defaults:
- env/libero_spatial@env.train
- env/libero_spatial@env.eval
- model/gr00t_n1d7@actor.model
- hybrid_engines/fsdp@actor.fsdp_config
- weight_syncer/bucket_syncer@weight_syncer
- override hydra/job_logging: stdout
- _self_
hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
  - file://${oc.env:RLINF_PATH}/examples/embodiment/config
cluster:
  num_nodes: 1
  component_placement:
    actor,env,rollout: 0
weight_syncer:
  bucket:
    bucket_size: 134217728
    bucket_device: cpu
runner:
  task_type: embodied
  logger:
    log_path: ${oc.env:EMBODIED_TEMPLATE_ROOT}/runs/n1.7-libero-baseline/train
    project_name: rlinf
    experiment_name: n1_7_smoke
    logger_backends:
    - tensorboard
  max_epochs: 1
  max_steps: -1
  only_eval: false
  val_check_interval: 1
  save_interval: 1
  resume_dir: null
  ckpt_path: null
algorithm:
  normalize_advantages: true
  kl_penalty: kl
  group_size: 1
  reward_coef: 1.0
  rollout_epoch: 1
  eval_rollout_epoch: 1
  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: chunk_level
  update_epoch: 1
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: token-mean
  kl_beta: 0.01
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0
  gamma: 0.99
  gae_lambda: 0.95
  filter_rewards: false
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
  sampling_params:
    do_sample: true
    temperature_train: 1.0
    temperature_eval: 0.6
    top_k: 50
    top_p: 1.0
    repetition_penalty: 1.0
    add_BOS: false
  length_params:
    max_new_token: null
    max_length: 1024
    min_length: 1
env:
  group_name: EnvGroup
  train:
    total_num_envs: 1
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    auto_reset: true
    use_fixed_reset_state_ids: true
    specific_reset_id: 0
  eval:
    total_num_envs: 1
    group_size: 1
    auto_reset: true
    ignore_terminations: true
    max_episode_steps: 5
    max_steps_per_rollout_epoch: 5
    is_eval: true
    video_cfg:
      save_video: true
      info_on_video: true
      video_base_dir: ${runner.logger.log_path}/video/eval
    use_fixed_reset_state_ids: true
    specific_reset_id: 0
rollout:
  group_name: RolloutGroup
  backend: huggingface
  enable_offload: true
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    backbone_model_path: ${actor.model.backbone_model_path}
    precision: ${actor.model.precision}
actor:
  group_name: ActorGroup
  training_backend: fsdp
  micro_batch_size: 1
  global_batch_size: 5
  seed: 1234
  enable_offload: true
  model:
    model_type: gr00t_n1d7
    model_path: ${oc.env:EMBODIED_TEMPLATE_ROOT}/models/gr00t-n1.7-libero/libero_spatial
    backbone_model_path: ${oc.env:EMBODIED_TEMPLATE_ROOT}/models/cosmos-reason2-2b
    embodiment_tag: libero_sim
    add_value_head: true
    num_action_chunks: 1
    denoising_steps: 1
  optim:
    lr: 5.0e-06
    value_lr: 0.0001
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0
  fsdp_config:
    strategy: fsdp
    sharding_strategy: full_shard
    gradient_checkpointing: true
    use_orig_params: true
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}
    save_full_model_weights: false
reward:
  use_reward_model: false
critic:
  use_critic_model: false
